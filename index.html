<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Currency Converter</title>

        <link rel="stylesheet" href="styles.css">

    </head>
    <body>
        <header>
            <h1 id="header">Currency Converter</h1>
            <p>Convert currencies quickly and easily</p>
        </header>
        <main>
            <h2>Currency Conversion</h2>

            <label>Amount:</label>
            <input type="number" id="amount">
            <br><br>
            <label>From:</label>
            <select id="fromCurrency">
                <option>USD</option>
                <option>EUR</option>
                <option>GBP</option>
                <option>JPY</option>
                <option>AUD</option>
                <option>CAD</option>
            </select>
            <br><br>
            <label>To:</label>
            <select id="toCurrency">
                <option>USD</option>
                <option>EUR</option>
                <option>GBP</option>
                <option>JPY</option>
                <option>AUD</option>
                <option>CAD</option>
            </select>
            <br><br>
            <button id="convertButton">Convert</button>

            <h3 id="result"></h3>
            <hr>
            <h2>Conversion History</h2>
            <div id="history"></div>
            <hr>
            <h2>Statistics</h2>
            <p id="totalConversions">Total Conversions: 0</p>
        </main>

        <script src="script.js"></script>
    </body>
</html>
